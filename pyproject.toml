[project]
name = "rag-wright"
version = "0.1.0"
description = "A domain-retargetable, open-core engine for hybrid retrieval + knowledge-graph RAG: parsing, chunking, embedding, hybrid search, reranking, graph extraction, entity resolution, ontology-driven knowledge, and a capability runtime."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farhan Zaidi", email = "farhan.zaidi@dreamai.io" }]
maintainers = [{ name = "Farhan Zaidi", email = "farhan.zaidi@dreamai.io" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "knowledge-graph",
    "ontology",
    "arcadedb",
    "reranking",
    "capability-runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "arcadedb-python>=0.4.0",
    "deepagents>=0.7.15", # floor, not a hard pin: an == bound every downstream consumer (issue 0047, ADR-0015)
    "docling>=2.109.0",
    "docling-core>=2.86.0",
    "docling-graph[templategen]>=1.9.1",
    "fastmcp>=3.4.6",
    "flagembedding>=1.4.0",
    "google-cloud-storage>=3.13.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.3.3",
    "langchain-quickjs>=0.3.2", # floor, not a hard pin (no-== rule); MIT (quickjs-rs); used by the RLM interpreter agent (parked surface, ADR-0015/0052)
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "laya>=0.3.22",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pyshacl>=0.40.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.1.0",
    "transformers>=5.4,<5.9",
]

[project.urls]
Homepage = "https://github.com/fzaidi-dai/RAG_Wright"
Repository = "https://github.com/fzaidi-dai/RAG_Wright"
Documentation = "https://github.com/fzaidi-dai/RAG_Wright/tree/main/docs"

[project.optional-dependencies]
# Optional spaCy NER (ADR superseding ADR-0012): spaCy is an extra, and its model
# (en_core_web_sm) is a runtime download (`uv run python -m spacy download en_core_web_sm`,
# configurable via RAG_SPACY_MODEL) — the model is not on PyPI, so it is never a declared
# or direct-URL dependency. Loaded via rag_wright.util.spacy_model.load_spacy_model.
ner = [
    "spacy>=3.8.14",
]
ocr-bench = [
    "mlx-vlm>=0.3.9",
    "ocrmac>=1.0.1",
    "onnxruntime>=1.29.0",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "modal>=1.5.3",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_wright"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["src", "."]
# ASYNC-A1 (ADR-0057): the engine is going async; "auto" mode runs an `async def test_*` natively without a
# per-test marker, so async tests read like sync ones. Sync tests are unaffected.
asyncio_mode = "auto"
markers = [
    "model: opt-in live model call via OpenRouter (needs .env); run with -m model",
    "store: opt-in test needing a local ArcadeDB instance; run with -m store",
    "parse: opt-in live Docling parse (needs models + the gitignored corpus); run with -m parse",
    "embed: opt-in live BGE-M3 encode (downloads the model); run with -m embed",
    "rerank: opt-in live BGE-reranker cross-encoder (downloads the model); run with -m rerank",
    "ner: opt-in live spaCy NER model (en_core_web_sm); run with -m ner",
    "fleet: opt-in load of the LOCAL clause-classifier fleet (20+ transformer models, multi-GB RSS); run with -m fleet",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# DD-6 (ADR-0067 #5, AC-no-leak): the de-domaining import boundary, enforced by import-linter (run as a pytest
# test, tests/arch/test_import_contracts.py -- no separate CI). The GENERIC engine foundation (the store, the engine
# API surface, and the de-domained generic primitives) must not import the reference CONTRACT/COMPLIANCE domain pack;
# a re-coupling import fails the contract. `rag_wright.api` joined the source set in EP-API-6b, once the generic
# docling-parse helpers moved out of the contract pipeline into `capabilities.document_parse`. NOT in the source set:
# the domain GRAPHS (contract_ingestion_pipeline, compliance_check, the contract/compliance stores) -- they are allowed
# to import domain (the primitives-vs-domain-graphs rule). Product->Engine (the other half of ADR-0067 #5) is a
# PRODUCT-repo contract, enforced in RuleWright.
[tool.importlinter]
root_packages = ["rag_wright"]

[[tool.importlinter.contracts]]
name = "Generic engine foundation is domain-free (de-domaining, ADR-0067 #5)"
type = "forbidden"
source_modules = [
    "rag_wright.store.arcadedb",
    "rag_wright.store.seam",
    "rag_wright.store.chunk_text",
    "rag_wright.api",
    "rag_wright.ontology.registry",
    "rag_wright.capabilities.graph_query",
    "rag_wright.capabilities.retrieval_core",
    "rag_wright.capabilities.invoke",
    "rag_wright.capabilities.manifests",
    "rag_wright.capabilities.registry",
    "rag_wright.capabilities.remote_encoders",
    "rag_wright.capabilities.embedding_profiles",
    "rag_wright.capabilities.disambiguation",
    "rag_wright.capabilities.entity_resolution",
    "rag_wright.capabilities.graph_storage",
]
forbidden_modules = [
    "rag_wright.corpus.edgar",
    "rag_wright.corpus.cuad_ingestion",
    "rag_wright.ontology.contract_taxonomy",
    "rag_wright.contracts.compliance",
    "rag_wright.contracts.contract_meta",
    "rag_wright.capabilities.contract_kg_store",
    "rag_wright.capabilities.contract_kg_serve",
    "rag_wright.capabilities.compliance_store",
    "rag_wright.capabilities.compliance_judgment",
    "rag_wright.capabilities.dg_extraction",
    "rag_wright.capabilities.graph_extraction",
    "rag_wright.subgraphs.contract_ingestion_pipeline",
    "rag_wright.subgraphs.compliance_check",
    "rag_wright.subgraphs.compliance_ingestion",
    "rag_wright.subgraphs.relational_qa",
    "rag_wright.subgraphs.intra_document_qa",
]
