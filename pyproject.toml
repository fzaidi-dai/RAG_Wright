[project]
name = "rag-wright"
version = "0.1.0"
description = "RAG_Wright: the capability half of the Hybrid RAG system (SPEC.md v0.1). Builds and registers the FR-C capabilities as ordinary tested software."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arcadedb-python>=0.4.0",
    "deepagents==0.6.12", # pinned exactly: dynamic sub-agents are beta, floating = silent breakage (ADR-0015)
    "docling>=2.109.0",
    "docling-core>=2.86.0",
    "docling-graph[templategen]==1.9.1",
    "en-core-web-sm",
    "fastmcp>=3.4.6",
    "flagembedding>=1.4.0",
    "google-cloud-storage>=3.13.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.3.3",
    "langchain-quickjs==0.3.2", # pinned exactly: interpreter runtime is beta (ADR-0015); MIT (quickjs-rs)
    "langgraph",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pyshacl>=0.40.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.14",
    "transformers>=4.44.2,<5",
]

[dependency-groups]
dev = [
    "modal>=1.5.3",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_wright"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["src", "."]
markers = [
    "model: opt-in live model call via OpenRouter (needs .env); run with -m model",
    "store: opt-in test needing a local ArcadeDB instance; run with -m store",
    "parse: opt-in live Docling parse (needs models + the gitignored corpus); run with -m parse",
    "embed: opt-in live BGE-M3 encode (downloads the model); run with -m embed",
    "rerank: opt-in live BGE-reranker cross-encoder (downloads the model); run with -m rerank",
    "ner: opt-in live spaCy NER model (en_core_web_sm); run with -m ner",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
