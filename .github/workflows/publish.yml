name: Publish to PyPI

# Publishes `rag-wright` to PyPI via Trusted Publishing (OIDC) — no API token or stored secret.
# It runs ONLY when a GitHub Release is published (a deliberate action), or manually from the Actions tab;
# merely pushing commits never publishes. On a Release it first asserts the tag matches the pyproject version.
# Releases are normally created by release-please.yml when its batched release PR is merged (docs/releasing.md).
#
# PyPI Trusted Publisher config (pypi.org → your account → Publishing, add a "pending publisher" before the
# first release, or project `rag-wright` → Settings → Publishing afterwards):
#   Owner:              fzaidi-dai
#   Repository name:    RAG_Wright
#   Workflow filename:  publish.yml        <-- this file
#   Environment name:   pypi               <-- matches `environment.name` below (also create it in
#                                              GitHub → Settings → Environments; add reviewers for an approval gate)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish rag-wright
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rag-wright
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"   # accept an optional leading 'v' (v0.1.0 == 0.1.0)
          echo "pyproject version: '$version'  |  release tag: '$tag'"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag ('$tag') does not match pyproject version ('$version') — bump pyproject or retag"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
