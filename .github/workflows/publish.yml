name: Publish to PyPI

# Publishes `rag-wright` to PyPI via Trusted Publishing (OIDC) — no API token or stored secret.
# It runs ONLY when a GitHub Release is published (a deliberate action), or manually from the Actions tab;
# merely pushing commits never publishes.
#
# PyPI Trusted Publisher config (pypi.org → your account → Publishing, add a "pending publisher" before the
# first release, or project `rag-wright` → Settings → Publishing afterwards):
#   Owner:              fzaidi-dai
#   Repository name:    RAG_Wright
#   Workflow filename:  publish.yml        <-- this file
#   Environment name:   pypi               <-- matches `environment.name` below (also create it in
#                                              GitHub → Settings → Environments; add reviewers for an approval gate)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish rag-wright
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rag-wright
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
